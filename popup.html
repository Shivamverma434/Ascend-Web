<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ascend nudge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="fx"></canvas>
    <div class="floater" id="floater">
      <div class="mascot" id="mascot"></div>
      <article class="card" id="card">
        <div class="glow"></div>
        <div class="inner">
          <div class="bubbles"><i></i><i></i><i></i><i></i><i></i></div>
          <button class="close" id="close" aria-label="Dismiss">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <div class="top">
            <div class="orb" id="orb">
              <svg class="orb-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="6"/><circle class="orb-fill" cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
              <div class="orb-text"><b id="stat"></b><span id="statLabel"></span></div>
              <div class="rays"></div>
            </div>
            <div class="text">
              <div class="eyebrow" id="eyebrow"></div>
              <h1 id="title"></h1>
              <p id="body"></p>
            </div>
          </div>
          <div class="actions" id="actions"></div>
        </div>
        <div class="timer"><i id="timerBar"></i></div>
      </article>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
